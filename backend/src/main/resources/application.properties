spring.datasource.url=jdbc:postgresql://localhost:5432/crud_app
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT settings (secret must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
app.jwt.expiration-minutes=60

# Send our error messages (e.g. "Invalid email or password.") to the frontend
server.error.include-message=always