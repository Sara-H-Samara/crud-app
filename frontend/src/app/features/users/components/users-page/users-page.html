<div class="users-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">USER MANAGEMENT</p>
      <h1>Manage your users</h1>
      <p class="subtitle">
        Add, view, update, and manage users from one place.
      </p>
    </div>

    <div class="user-count">
      <span class="count">{{ userService.count() }}</span>
      <span>Users</span>
    </div>
  </header>

  <!-- UserForm injects UserService itself: no inputs/outputs needed -->
  <app-user-form />

  <section class="users-section">
    <div class="section-title">
      <h2>Users</h2>
      <span>All registered users</span>
    </div>

    <!-- UserList stays a simple "presentational" component with input/output -->
    <app-user-list
      [users]="userService.users()"
      (editUser)="userService.select($event)"
      (deleteUser)="userService.remove($event)"
    />
  </section>
</div>
