<div class="users-page">
  <header class="page-header">
    <div>
      <h1>Users</h1>
      <p class="subtitle">Add, edit and remove the people in your registry.</p>
    </div>

    <div class="user-count">
      <span class="count">{{ userService.count() }}</span>
      <span>users</span>
    </div>
  </header>

  @if (errorMessage()) {
    <p class="msg warn page-error">{{ errorMessage() }}</p>
  }

  <app-user-form />

  <section class="users-section">
    <div class="section-title">
      <h2>All users</h2>
    </div>

    @if (loading()) {
      <p class="loading-message">Loading users…</p>
    } @else {
      <app-user-list
        [users]="userService.users()"
        (editUser)="userService.select($event)"
        (deleteUser)="onDelete($event)"
      />
    }
  </section>
</div>
