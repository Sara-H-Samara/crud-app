<h2>User Management</h2>

<!-- ==================== ADD USER ==================== -->

<h3>Add User</h3>

<input type="text" placeholder="Name" [(ngModel)]="newName" />

<input type="email" placeholder="Email" [(ngModel)]="newEmail" />

<button (click)="addUser(newName, newEmail)" [disabled]="!newName || !newEmail">
  Add User
</button>

<hr />

<!-- ==================== EDIT USER ==================== -->

@if (editingUser) {

<h3>Edit User</h3>

<input type="text" placeholder="Name" [(ngModel)]="editName" />

<input type="email" placeholder="Email" [(ngModel)]="editEmail" />

<button (click)="saveEdit()" [disabled]="!editName || !editEmail">Save</button>

<button (click)="cancelEdit()">Cancel</button>

<hr />
}

<!-- ==================== USERS LIST ==================== -->

<h3>Users List</h3>

<p>Number of users: {{ users.length }}</p>

@for (user of users; track user.id) {

<div class="user-card">
  <p>
    <strong>ID:</strong>
    {{ user.id }}
  </p>

  <p>
    <strong>Name:</strong>
    {{ user.name }}
  </p>

  <p>
    <strong>Email:</strong>
    {{ user.email }}
  </p>

  <button (click)="editUser(user)">Edit</button>

  <button (click)="deleteUser(user.id!)">Delete</button>
</div>
}
